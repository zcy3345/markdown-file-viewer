[package]
name = "mdv"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mdv"
path = "src/main.rs"

[dependencies]
comrak = { version = "1.0.0-rc.1", default-features = false }
# 语法集来自 two-face，主题来自 assets/mdv-dark.tmTheme，
# 所以 syntect 自带的 default-syntaxes / default-themes 都不需要（省 ~370 KB）
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "plist-load"] }
once_cell = "1"
# bat 的扩展语法集（syntect 自带的 75 种里没有 TypeScript / TOML / Dockerfile / PowerShell…）
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }

# 只用于读注册表默认值（reg.exe 的 stdout 是 OEM 代码页，中文会被解成 U+FFFD）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
